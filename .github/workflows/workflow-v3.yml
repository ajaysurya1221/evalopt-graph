name: Workflow v3

on:
  push:
    branches: [feat/evidence-phase-difficulty]
  pull_request:
    paths:
      - skills/eval-opt-v3/**
      - bench/harbor/skill-workflows-v3/**
      - results/skill-workflows-v3/**
      - .github/workflows/workflow-v3.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: ./.github/workflows/ci.yml
  offline:
    name: V3 controls and v1/v2 preservation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full preservation history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact controller Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.12'
      - name: Sync locked development tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.29
          uv sync --frozen --extra dev --python 3.13.12
      - name: Verify every original byte and mode
        run: uv run --frozen --extra dev python -I -B bench/harbor/skill-workflows-v3/run.py preserve
      - name: Run independent v3 test process
        run: uv run --frozen --extra dev python -I -B -m pytest -p no:cacheprovider -rs bench/harbor/skill-workflows-v3/tests
      - name: Check v3 source quality
        run: |
          uv run --frozen --extra dev ruff check bench/harbor/skill-workflows-v3
          uv run --frozen --extra dev ruff format --check bench/harbor/skill-workflows-v3
      - name: Reproduce immutable v2 public evidence
        run: |
          uv run --frozen --extra dev python -I -B results/skill-workflows-v2/development-revision-1-2026-10-11/reproduce.py --repo . --bundle results/skill-workflows-v2/development-revision-1-2026-10-11
      - name: Reproduce v3 offline evidence correspondence
        run: uv run --frozen --extra dev python -I -B results/skill-workflows-v3/offline-package-2026-10-11/reproduce.py
      - name: Reproduce fixed difficulty registration
        run: uv run --frozen --extra dev python -I -B results/skill-workflows-v3/difficulty-registration-2026-10-11/reproduce.py
