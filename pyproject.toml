[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalopt-graph"
version = "0.1.0"
description = "Host-independent deterministic governance and evidence-integrity kernel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ajay Surya Senthilrajan" }]
keywords = ["agents", "governance", "evaluation", "evidence", "reproducibility"]

# The stable kernel has zero required dependencies and imports no host runtime or provider SDK.
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]  # optional real providers (need API keys via env)
yaml = ["pyyaml>=6"]                        # optional: load .evalopt/config.yaml
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.25,<5"]
all = ["evalopt-graph[llm,yaml,dev]"]         # self-referential to avoid constraint drift

[project.scripts]
evalopt = "evalopt_graph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evalopt_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines tolerated in docstrings/templates
