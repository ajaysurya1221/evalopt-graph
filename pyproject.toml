[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "evalopt-graph"
version = "0.1.0"
description = "Deterministic acceptance policy for AI coding agents: turns gate results, claims and hash-bound evidence into a replayable ACCEPT / BLOCK / UNVERIFIED decision. Zero runtime dependencies, Python 3.10-3.14."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ajay Surya Senthilrajan" }]
maintainers = [{ name = "Ajay Surya Senthilrajan" }]
keywords = ["agents", "governance", "evaluation", "evidence", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

# The stable kernel has zero required dependencies and imports no host runtime or provider SDK.
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.11.0", "openai>=3.23.0"]  # optional real providers (need API keys via env)
yaml = ["pyyaml>=6"]                        # optional: load .evalopt/config.yaml
dev = ["pytest>=9.1.1", "ruff>=0.16.10", "jsonschema>=4.26.0,<5"]
all = ["evalopt-graph[llm,yaml,dev]"]         # self-referential to avoid constraint drift

[project.scripts]
evalopt = "evalopt_graph.cli:main"

[project.urls]
Homepage = "https://github.com/ajaysurya1221/evalopt-graph"
Documentation = "https://github.com/ajaysurya1221/evalopt-graph#readme"
Repository = "https://github.com/ajaysurya1221/evalopt-graph"
Issues = "https://github.com/ajaysurya1221/evalopt-graph/issues"
Changelog = "https://github.com/ajaysurya1221/evalopt-graph/blob/main/CHANGELOG.md"

# Pin the core metadata version so artifacts stay stable across hatchling upgrades
# (newer hatchling defaults to 2.5, which twine 6.2.0 rejects); 2.4 carries the SPDX license fields.
[tool.hatch.build.targets.wheel]
packages = ["src/evalopt_graph"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/.gitignore",
    "/src",
    "/tests",
    "/bench/harbor",
    "/docs",
    "/scripts",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/pyproject.toml",
]
exclude = [
    "/.backups",
    "/.context",
    "/.evalopt",
    "/.github",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/build",
    "/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines tolerated in docstrings/templates
