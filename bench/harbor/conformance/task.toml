schema_version = "1.3"

[task]
name = "evalopt/kernel-adapter-conformance"
description = "Deterministic smoke test for the Harbor-to-kernel verifier adapter."
authors = []
keywords = ["governance", "conformance"]

[metadata]
evidence_class = "repository-authored integration smoke; not a holdout"
grading_contract = "policy verifier only; public conformance oracle runs separately after Harbor stops"

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
mcp_servers = []

[agent]
timeout_sec = 60.0

[environment]
network_mode = "no-network"
docker_image = "ubuntu:24.04"
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
mcp_servers = []

[verifier.env]
[environment.env]
[solution.env]
