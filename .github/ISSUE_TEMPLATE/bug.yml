name: Bug report
description: Report reproducible incorrect behavior in a 0.1.x release or a named commit, with a minimal reproduction.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Standalone feature development of evalopt has ended; bug reports against a `0.1.x` release or a named commit remain open when they include a version and a minimal reproduction. Deprecated compatibility surfaces receive no feature work, and a bug in one of them may be documented rather than fixed. Do not include credentials, private data, or undisclosed security issues. Report vulnerabilities through the private security advisory link in the issue chooser.
  - type: input
    id: version
    attributes:
      label: evalopt version or commit
      description: For example, `0.1.0` or a full commit SHA.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - Not applicable
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest policy, input, and command or code that reproduces the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the decision status, reason codes, traceback, or sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Explain whether this affects the stable kernel (the ten root exports), a deprecated compatibility surface, or a host integration. Feature requests and new integrations are not accepted; see the migration map.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This report contains no secrets or private data.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
